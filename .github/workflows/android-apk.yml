name: Build Game Volt Gamepad Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Debug APK (Game Volt Gamepad)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Game Volt Gamepad Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Volt-Gamepad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

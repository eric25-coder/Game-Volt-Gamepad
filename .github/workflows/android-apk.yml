name: Build Game Volt Gamepad Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Debug APK (Game Volt Gamepad)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM dependencies
        run: npm install

      - name: Build web application bundle
        run: npm run build

      - name: Sync existing Capacitor Android project
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Assemble Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Game Volt Gamepad Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Volt-Gamepad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

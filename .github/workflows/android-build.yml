name: Build Game Volt Gamepad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Game Volt Gamepad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure existing runner Android SDK environment
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      - name: Diagnose Android SDK and install only missing packages
        run: |
          echo "=== Android SDK Diagnostic Check ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist at $ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "✔ Android SDK directory exists: $ANDROID_SDK_ROOT"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found in $ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "✔ sdkmanager found at: $SDKMANAGER"
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          MISSING_PACKAGES=()

          if [ ! -d "$ANDROID_SDK_ROOT/platform-tools" ]; then
            MISSING_PACKAGES+=("platform-tools")
          fi

          for PLATFORM_VER in "android-36" "android-34"; do
            if [ ! -d "$ANDROID_SDK_ROOT/platforms/$PLATFORM_VER" ]; then
              MISSING_PACKAGES+=("platforms;$PLATFORM_VER")
            fi
          done

          for BUILD_TOOLS_VER in "36.0.0" "34.0.0"; do
            if [ ! -d "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VER" ]; then
              MISSING_PACKAGES+=("build-tools;$BUILD_TOOLS_VER")
            fi
          done

          if [ ${#MISSING_PACKAGES[@]} -gt 0 ]; then
            echo "Installing missing Android SDK packages: ${MISSING_PACKAGES[*]}"
            "$SDKMANAGER" "${MISSING_PACKAGES[@]}"
          else
            echo "✔ All required Android SDK platforms and build-tools are already installed."
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Volt-Gamepad-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
